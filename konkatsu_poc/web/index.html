<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>婚活パーティー統合ビュー (PoC)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #fafafa; }
      .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
      .topbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
      button { border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
      .primary { background: #1967d2; color: #fff; }
      .secondary { background: #eceff1; }
      .pill { background: #e3f2fd; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>婚活パーティー統合ビュー (PoC)</h1>
    <p>IBJ/TMS など複数サイトの候補をまとめて表示し、参加予定を管理する最小デモです。</p>

    <div class="topbar">
      <label>年代:
        <select id="ageBand">
          <option value="20">20代</option>
          <option value="30" selected>30代</option>
          <option value="40">40代</option>
        </select>
      </label>
      <button class="secondary" id="reloadBtn">再読み込み</button>
      <button class="primary" id="downloadIcsBtn">予定をICSで保存</button>
    </div>

    <h2>候補一覧</h2>
    <div id="partyList"></div>

    <h2>自分の予定</h2>
    <ul id="mySchedule"></ul>

    <script>
      const state = { parties: [], schedule: JSON.parse(localStorage.getItem('mySchedule') || '[]') };

      async function loadParties() {
        const res = await fetch('./aggregated_parties.json');
        state.parties = await res.json();
        render();
      }

      function toAgeRange(band) {
        if (band === 20) return [20, 29];
        if (band === 30) return [30, 39];
        return [40, 49];
      }

      function candidateForBand(party, band) {
        const [minAge, maxAge] = toAgeRange(band);
        return party.age_max >= minAge && party.age_min <= maxAge;
      }

      function toggleSchedule(id) {
        const i = state.schedule.indexOf(id);
        if (i >= 0) state.schedule.splice(i, 1);
        else state.schedule.push(id);
        localStorage.setItem('mySchedule', JSON.stringify(state.schedule));
        render();
      }

      function partyById(id) {
        return state.parties.find((p) => p.id === id);
      }

      function render() {
        const band = Number(document.getElementById('ageBand').value);
        const list = document.getElementById('partyList');
        const schedule = document.getElementById('mySchedule');
        list.innerHTML = '';
        schedule.innerHTML = '';

        state.parties
          .filter((p) => candidateForBand(p, band))
          .forEach((p) => {
            const card = document.createElement('div');
            card.className = 'card';
            const selected = state.schedule.includes(p.id);
            card.innerHTML = `
              <div><span class="pill">${p.site}</span> <strong>${p.title}</strong></div>
              <div>${p.date} ${p.start_time}-${p.end_time} / ${p.location}</div>
              <div>対象年齢: ${p.age_min}-${p.age_max}歳</div>
              <div>料金: 男性¥${p.price_male} / 女性¥${p.price_female}</div>
              <a href="${p.url}" target="_blank" rel="noopener noreferrer">公式ページ</a>
              <div style="margin-top:8px;">
                <button class="${selected ? 'secondary' : 'primary'}" data-id="${p.id}">
                  ${selected ? '予定から外す' : '予定に入れる'}
                </button>
              </div>
            `;
            card.querySelector('button').addEventListener('click', () => toggleSchedule(p.id));
            list.appendChild(card);
          });

        state.schedule
          .map(partyById)
          .filter(Boolean)
          .forEach((p) => {
            const item = document.createElement('li');
            item.textContent = `${p.date} ${p.start_time} ${p.title} (${p.site})`;
            schedule.appendChild(item);
          });
      }

      function downloadIcs() {
        const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Konkatsu PoC//JP'];
        state.schedule.map(partyById).filter(Boolean).forEach((p) => {
          const date = p.date.replaceAll('-', '');
          const start = p.start_time.replace(':', '') + '00';
          const end = p.end_time.replace(':', '') + '00';
          lines.push('BEGIN:VEVENT');
          lines.push(`UID:${p.id}@konkatsu-poc`);
          lines.push(`DTSTART:${date}T${start}`);
          lines.push(`DTEND:${date}T${end}`);
          lines.push(`SUMMARY:${p.title}`);
          lines.push(`LOCATION:${p.location}`);
          lines.push(`DESCRIPTION:${p.url}`);
          lines.push('END:VEVENT');
        });
        lines.push('END:VCALENDAR');
        const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'konkatsu_schedule.ics';
        a.click();
        URL.revokeObjectURL(url);
      }

      document.getElementById('ageBand').addEventListener('change', render);
      document.getElementById('reloadBtn').addEventListener('click', loadParties);
      document.getElementById('downloadIcsBtn').addEventListener('click', downloadIcs);
      loadParties();
    </script>
  </body>
</html>
