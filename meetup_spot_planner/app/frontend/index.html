<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meetup Spot Planner MVP</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      body { font-family: sans-serif; margin: 0; }
      .layout { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
      .side { padding: 16px; overflow: auto; border-right: 1px solid #ddd; }
      #map { width: 100%; height: 100%; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
      .score { font-weight: 700; color: #1f6feb; }
      input, button { width: 100%; margin-top: 6px; padding: 8px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="side">
        <h2>Meetup Spot Planner</h2>
        <label>待ち合わせ地点</label>
        <input id="meetupPoint" value="新宿南口" />
        <label>目的タグ（カンマ区切り）</label>
        <input id="tags" value="conversation,quiet" />
        <button id="searchBtn">検索</button>

        <h3>おすすめ一覧</h3>
        <div id="results"></div>
      </aside>
      <main id="map"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
      const map = L.map('map').setView([35.6895, 139.6917], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      let markers = [];

      async function runSearch() {
        const meetupPoint = document.getElementById('meetupPoint').value || '新宿南口';
        const tags = document.getElementById('tags').value
          .split(',')
          .map(t => t.trim())
          .filter(Boolean);

        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ meetup_point: meetupPoint, purpose_tags: tags })
        });

        const data = await res.json();
        render(data.ranked_places || []);
      }

      function render(places) {
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        const results = document.getElementById('results');
        results.innerHTML = '';

        places.forEach((p, idx) => {
          const marker = L.marker([p.lat, p.lng]).addTo(map).bindPopup(`${idx + 1}. ${p.name}`);
          markers.push(marker);

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<div><strong>${idx + 1}. ${p.name}</strong></div>
                            <div class="score">score: ${p.easiness_score}</div>
                            <div>${p.recommendation_reason}</div>
                            <div>距離: ${p.distance_from_meetup_m}m / 予約: ${p.reservation_status} / 混雑: ${p.crowd_estimation}</div>`;
          results.appendChild(card);
        });

        if (places[0]) {
          map.setView([places[0].lat, places[0].lng], 15);
        }
      }

      document.getElementById('searchBtn').addEventListener('click', runSearch);
      runSearch();
    </script>
  </body>
</html>
