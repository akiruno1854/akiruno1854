services:
  source-os:
    image: opensearchproject/opensearch:1.3.14
    container_name: source-os
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - path.repo=/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - source-data:/usr/share/opensearch/data
      - snapshots:/snapshots
    ports:
      - "9201:9200"

  target-os:
    image: opensearchproject/opensearch:2.11.1
    container_name: target-os
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - path.repo=/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - target-data:/usr/share/opensearch/data
      - snapshots:/snapshots
    ports:
      - "9202:9200"

volumes:
  source-data:
  target-data:
  snapshots:
